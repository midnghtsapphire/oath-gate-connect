services:
  app:
    build: .
    ports:
      - "8001:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://appuser:${POSTGRES_PASSWORD:-change-me}@db:5432/oathgate}
      REDIS_URL: redis://redis:6379/0
      APP_URL: ${APP_URL:-http://localhost:8001}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8001}
    env_file:
      - path: .env
        required: false
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: oathgate
    ports:
      - "9001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "10001:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
